# Builds the web version (Emscripten -> WebAssembly) and publishes it on GitHub Pages,
# the same way The Fort is served: open the Pages URL in Safari, Share > Add to Home Screen.
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Headless game tests
        run: |
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DSDL_UNIX_CONSOLE_BUILD=ON
          cmake --build build-native --target rpg_test save_test -j4
          ./build-native/rpg_test --seeds 1..20
          for s in 7 99 12345; do ./build-native/rpg_test $s --secs 60; done

      # The current save format (SAVE_VER 5) only: owner rule 2026-10-04, old saves are not carried over. The fixture
      # holds format-level facts only and the round trips run on this machine, so the check is platform-stable: blocking.
      - name: Save format test
        run: ./build-native/save_test

      # M1 endless world: generator order independence, start plan, spacing, kingdoms, rock share, reachability flood
      # and plateau check (costs reported, not gated on shared runners); the Active Window (walks, shifts,
      # streaming, fast travel, save round trips)
      - name: Endless world tests
        run: |
          ./build-native/rpg_test --endless --seeds 1..10 --no-budget
          ./build-native/rpg_test --window --seeds 1..5
          ./build-native/rpg_test --towns --seeds 1..10

      # rpg/world integer noise/ids golden values (M1 prep): must match MSVC bit for bit (green on Linux, run 37161023299).
      - name: Endless-world golden test
        run: ./build-native/rpg_test --golden

      # M1 WORLD lane, owner rule D (cross-platform determinism): the endless generator's region plans, chunks and macro
      # samples near the origin and about 1e5 tiles out must hash exactly as on MSVC (tests/fixtures/golden_endless.txt;
      # integer maths only, settlement interiors masked out). Blocking.
      - name: Endless generator golden test
        run: ./build-native/rpg_test --endless --golden

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build for the web
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web --target embervale -j4

      - name: Assemble site
        run: |
          mkdir -p site
          cp web/* site/
          cp build-web/embervale.js build-web/embervale.wasm site/
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
