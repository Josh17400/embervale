# Builds the web version (Emscripten -> WebAssembly) and publishes it on GitHub Pages,
# the same way The Fort is served: open the Pages URL in Safari, Share > Add to Home Screen.
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Headless game tests
        run: |
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DSDL_UNIX_CONSOLE_BUILD=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-native --target rpg_test save_test -j4
          ./build-native/rpg_test --seeds 1..20
          for s in 7 99 12345; do ./build-native/rpg_test $s --secs 60; done

      # The current save format (SAVE_VER 19: M8b items carry 4 affix slots, the Mythic rarity and its power) only: owner rule 2026-10-04, old saves are not carried over. The fixture
      # holds format-level facts only and the round trips run on this machine, so the check is platform-stable: blocking.
      - name: Save format test
        run: ./build-native/save_test

      # M1 endless world: generator order independence, start plan, spacing, kingdoms, rock share, reachability flood
      # and plateau check (costs reported, not gated on shared runners); the Active Window (walks, shifts,
      # streaming, fast travel, save round trips)
      - name: Endless world tests
        run: |
          ./build-native/rpg_test --endless --seeds 1..10 --no-budget
          ./build-native/rpg_test --window --seeds 1..5
          ./build-native/rpg_test --towns --seeds 1..10

      # M4 Banners (VISION_PLAN 15.17): the living world: genesis round the start, every loaded settlement known, the
      # forcing calls leave a consistent state (owners and banners follow a conquest), the realm block round-trips.
      # --history: the slow-diplomacy targets (famine -> trade collapse -> war, owner 15.6). Blocking.
      - name: Realm test
        run: |
          ./build-native/rpg_test --realm --seeds 1..10
          ./build-native/rpg_test --history 2000 --seeds 1..20

      # M4 WARDS: kingdom guards in their owner's colours, frontier militia, raids, sieges, overlays. Blocking.
      - name: Wards test
        run: ./build-native/rpg_test --wards --seeds 1..10

      # M4 STORY: the quest DSL library, every path to every ending, story block round trip, lore and rumours. Blocking.
      - name: Story test
        run: ./build-native/rpg_test --story --seeds 1..5

      # M6b SAGAS (VISION_PLAN 15.20, 15.21): the generated-story library lint (every archetype x voice x motive x twist
      # composes into a valid script; banned modern names), then 10,000 composed stories (2,000 per seed) cast on real
      # worlds with every path walked to an ending, rewards inside the M6 bands, uniqueness metrics. Blocking.
      - name: Saga test
        run: |
          ./build-native/rpg_test --sagalib
          ./build-native/rpg_test --sagas 2000 --seeds 1..5
          ./build-native/rpg_test --campaigns --seeds 1..5
          ./build-native/rpg_test --voice
          ./build-native/rpg_test --voice --lane

      # M5 Hearth and Hall (VISION_PLAN 15.12): the census, job templates, plans by the hour, the life block, the
      # 120-residents perf budget. Blocking.
      - name: Life test
        run: |
          ./build-native/rpg_test --life --seeds 1..5
          ./build-native/rpg_test --folk --seeds 1..5

      # M6 Steel (VISION_PLAN 7, 15.11, 15.19): item numbers, the SAVE_VER 12 item layout, crafting chains and culture
      # secrets, regional ores, the new families. Blocking.
      - name: Gear test
        run: |
          ./build-native/rpg_test --gear --seeds 1..3
          ./build-native/rpg_test --power-curve
          ./build-native/rpg_test --loot-audit
          ./build-native/rpg_test --foes --seeds 1..3
          ./build-native/rpg_test --arms --seeds 1..3
          ./build-native/rpg_test --arms --seeds 1..3 --rig=1

      # M8b Treasure (VISION_PLAN 15.27, 15.28): the loot overhaul. The rarity ladder gated by level, every non-Common
      # piece with a working visible affix from every source, the power curves (the iron / bronze example), determinism;
      # every affix and power that may roll works in play. Blocking.
      - name: Loot test
        run: |
          ./build-native/rpg_test --loot
          ./build-native/rpg_test --loot-sources --seeds 1..3
          ./build-native/rpg_test --powers

      # M9 Arcana & Mastery (VISION_PLAN 15.29, 15.30): the learn-by-use skills (tables, perk trees, the curve, foe tags,
      # the weapon families vs tags, armour trade-offs, gains from the right act only, perks and the block) and magic
      # (every spell within +-5% of its budget, statuses, surfaces and combos, the book, casting through the quick slots).
      # Blocking.
      - name: Skills and spells test
        run: |
          ./build-native/rpg_test --skills
          ./build-native/rpg_test --spells

      # M10 Beyond the Mist (VISION_PLAN 2.12, 13 M10, 15.4, 15.31): the hulls and fish, the lands and the Mist ring,
      # the sea block, boarding / sailing / saving at sea, the Mist's turn-back and the chart (the SEA lane adds the
      # --sail bot, storms, ferries, encounters, the chart chain, first contact and fishing). Blocking.
      - name: Sea test
        run: ./build-native/rpg_test --sea --seeds 1..3

      # M10 SEA (VISION_PLAN 13 M10 verification): the captain bot sails a sloop from the nearest harbour to continent 2;
      # streaming at sea at sloop and galleon speed on the phone's path (no worker: the 3 ms frame pump). Blocking.
      - name: Sail test
        run: ./build-native/rpg_test --sail --seeds 1..3

      # M11 High Ground (VISION_PLAN 13 M11, 15.32): no walled plateaus in the sampled windows, the relief census
      # (stacked faces, slopes, stairs, falls, summit shrines), slope speed, guards / companions pathing over ramps and
      # falls as walls. Timing budgets are dev-PC numbers, so CI runs --relief without them. Blocking.
      - name: Relief and climb test
        run: |
          ./build-native/rpg_test --relief --seeds 1..3 --no-budget
          ./build-native/rpg_test --climb --seeds 1..3

      # M12 Rise and Fall (VISION_PLAN 13 M12, 15.33): warlords, successors, alliances, vassals, enlisting, lordship and
      # independence, the save with all of it; the save soak (every save <= 1 MB and byte-identical over 100 cycles).
      # Blocking.
      - name: Rise test
        run: |
          ./build-native/rpg_test --rise --seeds 1..3
          ./build-native/rpg_test --save-soak 100
          ./build-native/rpg_test --service --seeds 1..3
          ./build-native/rpg_test --lord --seeds 1..3

      # P1 Fresh Roads (VISION_PLAN 15.34): the quests a player is offered over 12 weeks round the start (finished tales
      # never offered again, no four tales hogging the offers, campaigns that start, varied jobs, every hunt marked) and
      # the townsfolk going about their day (>= 15 % of the town centre walking 08-18, nobody static for 2 game hours
      # but sentries and posted workers in a work pose). Blocking.
      - name: Quest mix and town motion test
        run: |
          ./build-native/rpg_test --quest-mix --seeds 1..20 --gates --p1b --gates-p1b --ports
          ./build-native/rpg_test --town-motion --seeds 1..8 --city --gates

      # P1 Fresh Roads contracts: the weekly job pools (determinism, givers with offers, lead bookkeeping), the street's
      # stumble-on hooks (errands pay, incidents leave leads, the giver's pin), the story picker and the realm events
      # reaching the start's settlements. Blocking.
      - name: Fresh Roads jobs, life and story test
        run: |
          ./build-native/rpg_test --jobs --seeds 1..3
          ./build-native/rpg_test --life-p1 --seeds 1..3 --hooks
          ./build-native/rpg_test --story-p1 --seeds 1..3
          ./build-native/rpg_test --story-events --seeds 1..3

      # P1b New Roads Content (VISION_PLAN 15.35): every new job kind, request and tale force-started and played through
      # every branch (options, checks, goals, lost escorts and bouts, clocks), no soft lock, rewards paid, census outcomes,
      # journal text, epilogues; every line checked with the longest names the world can inject; --gates: 15 job kinds,
      # 30 requests, 20 tales. --radiant: every job walk composes over 40 seeds and flows through the weekly pools.
      # --p1b-engine: escort / wagon / drove walked by a bot, bouts won and lost, hostile, calm, people inside sites,
      # the heavy load, the beacon, casting rates. (The quest-mix line above also gates P1b: every job kind and request
      # offered, top-3 job kinds < 53.6 %, top-4 tales < 13.6 %.) Blocking.
      - name: New Roads content test
        run: |
          ./build-native/rpg_test --content-p1b --seeds 1..3 --gates
          ./build-native/rpg_test --radiant --seeds 1..3
          ./build-native/rpg_test --p1b-engine --seeds 1..5

      # P2a Clear Sight (VISION_PLAN 15.36): the rig contract (metrics, families, bodyPx identity at rig 1, the atlas
      # index, the weapon ids, the ink outer outline on every v1 character sheet == outlineInk(raw cell)), the v1 frame
      # pick at rig 1 against its frozen reference and golden (A1), and the rig coverage of a census (reported). rpg_test
      # links the painters (rpg_art) from P2a on.
      # P2b New People (phase A): rig 2 draws the DOLL (hand-placed part maps); --rig's gates are restated for A3 and
      # measure the doll's atlases, so they run without --gates until the P2b areas pass them. The doll's pool is
      # generated (tools/doll/pxc.mjs --check fails when rpg/art/doll/gen/doll_pool.cpp is stale), --doll checks the
      # contract, --doll-coverage reports B6. Each integrator adds --gates as its gates pass. Blocking.
      # (P2b integration, 2026-10-19) --doll --gates (B1, B2, faces, hands, B8, B9, B10, ramps, B11) passes on MSVC and
      # clang; --doll-coverage stays without --gates (B6's dead parts) and --rig without (R5-R10 are P2c's, H2 the seats).
      # (P2b motion rollout, 2026-10-23) --doll --gates adds B11 limbs (R L) (check.py's checks in C++), B11 wear (R L)
      # (W1-W10, T1, T2 over GATES-WEAR's 213-look matrix and part coverage), B12 boots (the library's boot measures) and
      # the M7 cloak watch in B10; rpg_test --doll-wear runs B11 wear, the freeze check and the M7 sweep alone. All pass
      # on MSVC and clang after the rollout's fix rounds (docs/P2B_MOTION_ROLLOUT.md 12).
      # (P2c flip, 2026-10-30, PLAN D100-D104) rig 2, the doll, is the default everywhere; rig 1 is an opt-in fallback
      # (EMB_RIG=1, --rig=1) until the owner's retirement OK. --rig opens with "the default rig is 2" and keeps the v1
      # contract by name; --anim's A1 still reads rig 1's pick against golden_anim_v1; --doll --gates, the census at C1
      # (--doll-coverage --scope all --seeds 1..20 --gates: 100 %, 0 dead parts, 0 postures on v1; C1's own seeds, since
      # seeds 1..3 leave 43 parts unreached even at b9e0108) and the variety gate run at the
      # default. --rig-coverage left CI (C1 replaces it; its code stays until the retirement). The Gear step's
      # `--arms --seeds 1..3 --rig=1` keeps the fallback's golden keys from rotting. --doll-ladder --selftest holds C12's
      # synthetic defects, D106's cover floor (a flat one-colour piece over a rich one FAILs) included. Blocking.
      - name: Clear Sight rig and animation test
        run: |
          node tools/doll/pxc.mjs --check
          ./build-native/rpg_test --rig
          ./build-native/rpg_test --anim --gates
          ./build-native/rpg_test --doll --gates
          ./build-native/rpg_test --doll-coverage --scope all --seeds 1..20 --gates
          ./build-native/rpg_test --doll-variety --seeds 1..3 --gates
          ./build-native/rpg_test --doll-ladder --selftest

      # M7 Home (VISION_PLAN 8, 15.22): crops and seasons, deterministic offline catch-up, a 1000-placement fuzz, the
      # 4 KB plot budget and the home block, building in a culture's style, riding and the dismount triggers. Blocking.
      - name: Home test
        run: ./build-native/rpg_test --home --seeds 1..3

      # M8 Fellowship (VISION_PLAN 9, 15.6.2, 15.26): the companions' tables and approval, the party block, a census
      # recruit following through a walk and the inn's door, deeds, downed / bound / dead for good with the census's
      # grief, the save with a party, and the damage share in three bands. Blocking.
      - name: Companion test
        run: |
          ./build-native/rpg_test --companion --seeds 1..3
          ./build-native/rpg_test --banter --seeds 1..3

      # M2/M4 quests: every quest type end to end (the dialogue paths picked by text, not by position), and THE DRAGON'S
      # SHADOW end to end by a teleporting bot (fixer M4 r3: these guard the STORY pitch path on clang too). Blocking.
      - name: Quest and main-quest test
        run: |
          ./build-native/rpg_test --quests
          ./build-native/rpg_test --mainquest

      # Town goldens (tests/fixtures): every settlement layout hashes as on MSVC. Blocking.
      - name: Town golden test
        run: ./build-native/rpg_test --towns --golden

      # M7b Cities & Voice / M7c Order of Streets (VISION_PLAN 15.23, 15.M7c): the villages keep their character (every
      # village-character rule, --strict since M7c integration), the structure score (city >> town >> village, every city
      # above the floor), the city plans' uniqueness, and the metric's own controls; and the dialogue review: real
      # conversations recorded and linted (placeholders, case, the phone panel...). Blocking.
      - name: Villages, settlement order and dialogue review
        run: |
          ./build-native/rpg_test --villages --strict
          ./build-native/rpg_test --structure --strict
          ./build-native/rpg_test --city-unique --strict
          ./build-native/rpg_test --plan-controls
          ./build-native/rpg_test --dialogue --seeds 1..3

      # M3 culture engine (VISION_PLAN 5.4): neighbouring families d >= 0.45 with >= 3 headline differences, dialects
      # d >= 0.10 (from their family and from neighbouring kingdoms of the same family), neighbouring kingdoms' arms
      # differ in >= 2 of tinctures / division / charge, order independence, name checks (no real-world fantasy names,
      # no profanity, HUD lengths), complete cultures. Blocking.
      - name: Culture engine test
        run: ./build-native/rpg_test --cultures 400 --seeds 1..5

      # M3b Builders & Societies (VISION_PLAN 15.14): every prop classified for the builder, every purpose x culture x
      # wealth x form designs a valid blueprint, complete societies with their essentials, a valid blueprint for every
      # building placed in a capital, city, town and village of every culture. Blocking, with --strict (the capital
      # repetition audit: no neighbour clones, no look group over 3) and --society-strict (the society's buildings placed).
      - name: Builder and society test
        run: ./build-native/rpg_test --builder --seeds 1..12 --strict --society-strict

      # M3c Wildlands (VISION_PLAN 15.15 / 15.16): every biome of rpg/world/biomes.h appears over seeds 1..5 (the tile
      # classifier's census), none covers more than 25 % of the land, the rare wondrous lands stay under 7 % together and
      # 2 % each; eco / family / blend layers consistent; order independent. And the forest rule (owner, 2026-10-06): no
      # two solid trees or rocks touching, >= 98 % of the open ground still walkable, canopy floors, in every wooded and
      # rocky biome (per biome report). The biomes drive the villages' trades: no specialty above 40 %, every one present.
      # Blocking.
      - name: Biomes and walkable wilds test
        run: |
          ./build-native/rpg_test --biomes --seeds 1..5 --strict
          ./build-native/rpg_test --forest --seeds 1..20
          ./build-native/rpg_test --specialties --seeds 1..20

      # rpg/world integer noise/ids golden values (M1 prep): must match MSVC bit for bit (green on Linux, run 37161023299).
      - name: Endless-world golden test
        run: ./build-native/rpg_test --golden

      # M1 WORLD lane, owner rule D (cross-platform determinism): the endless generator's region plans, chunks and macro
      # samples near the origin and about 1e5 tiles out must hash exactly as on MSVC (tests/fixtures/golden_endless.txt;
      # integer maths only, settlement interiors masked out). Blocking.
      - name: Endless generator golden test
        run: ./build-native/rpg_test --endless --golden

      # Pinned, not 'latest': Emscripten 6.0.13 silently dead-code eliminated the IDBFS the page mounts (the live site
      # hung on its loading screen with "IDBFS is not defined"). Move the pin on purpose and run the page check below.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13

      - name: Build for the web
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web --target embervale -j4

      # web/index.html reaches the runtime only through these Module exports (CMakeLists.txt EXPORTED_RUNTIME_METHODS);
      # one missing means the page cannot start or cannot keep saves. Blocking.
      - name: Check the page's runtime exports
        run: |
          emcc --version | head -1
          for f in FS IDBFS addRunDependency removeRunDependency; do
            grep -q "Module\[\"$f\"\]" build-web/embervale.js || { echo "embervale.js lacks Module.$f"; exit 1; }
          done
          grep -q indexedDB build-web/embervale.js || { echo "embervale.js has no IndexedDB code (IDBFS dropped)"; exit 1; }

      - name: Assemble site
        run: |
          mkdir -p site
          cp web/* site/
          cp build-web/embervale.js build-web/embervale.wasm site/
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
