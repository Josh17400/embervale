# Builds the web version (Emscripten -> WebAssembly) and publishes it on GitHub Pages,
# the same way The Fort is served: open the Pages URL in Safari, Share > Add to Home Screen.
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Headless game tests
        run: |
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DSDL_UNIX_CONSOLE_BUILD=ON
          cmake --build build-native --target rpg_test save_test -j4
          ./build-native/rpg_test --seeds 1..20
          for s in 7 99 12345; do ./build-native/rpg_test $s --secs 60; done

      # The current save format (SAVE_VER 9) only: owner rule 2026-10-04, old saves are not carried over. The fixture
      # holds format-level facts only and the round trips run on this machine, so the check is platform-stable: blocking.
      - name: Save format test
        run: ./build-native/save_test

      # M1 endless world: generator order independence, start plan, spacing, kingdoms, rock share, reachability flood
      # and plateau check (costs reported, not gated on shared runners); the Active Window (walks, shifts,
      # streaming, fast travel, save round trips)
      - name: Endless world tests
        run: |
          ./build-native/rpg_test --endless --seeds 1..10 --no-budget
          ./build-native/rpg_test --window --seeds 1..5
          ./build-native/rpg_test --towns --seeds 1..10

      # M3 culture engine (VISION_PLAN 5.4): neighbouring families d >= 0.45 with >= 3 headline differences, dialects
      # d >= 0.10 (from their family and from neighbouring kingdoms of the same family), neighbouring kingdoms' arms
      # differ in >= 2 of tinctures / division / charge, order independence, name checks (no real-world fantasy names,
      # no profanity, HUD lengths), complete cultures. Blocking.
      - name: Culture engine test
        run: ./build-native/rpg_test --cultures 400 --seeds 1..5

      # M3b Builders & Societies (VISION_PLAN 15.14): every prop classified for the builder, every purpose x culture x
      # wealth x form designs a valid blueprint, complete societies with their essentials, a valid blueprint for every
      # building placed in a capital, city, town and village of every culture. Blocking, with --strict (the capital
      # repetition audit: no neighbour clones, no look group over 3) and --society-strict (the society's buildings placed).
      - name: Builder and society test
        run: ./build-native/rpg_test --builder --seeds 1..12 --strict --society-strict

      # M3c Wildlands (VISION_PLAN 15.15 / 15.16): every biome of rpg/world/biomes.h appears over seeds 1..5 (the tile
      # classifier's census), none covers more than 25 % of the land, the rare wondrous lands stay under 7 % together and
      # 2 % each; eco / family / blend layers consistent; order independent. And the forest rule (owner, 2026-10-06): no
      # two solid trees or rocks touching, >= 98 % of the open ground still walkable, canopy floors, in every wooded and
      # rocky biome (per biome report). The biomes drive the villages' trades: no specialty above 40 %, every one present.
      # Blocking.
      - name: Biomes and walkable wilds test
        run: |
          ./build-native/rpg_test --biomes --seeds 1..5 --strict
          ./build-native/rpg_test --forest --seeds 1..20
          ./build-native/rpg_test --specialties --seeds 1..20

      # rpg/world integer noise/ids golden values (M1 prep): must match MSVC bit for bit (green on Linux, run 37161023299).
      - name: Endless-world golden test
        run: ./build-native/rpg_test --golden

      # M1 WORLD lane, owner rule D (cross-platform determinism): the endless generator's region plans, chunks and macro
      # samples near the origin and about 1e5 tiles out must hash exactly as on MSVC (tests/fixtures/golden_endless.txt;
      # integer maths only, settlement interiors masked out). Blocking.
      - name: Endless generator golden test
        run: ./build-native/rpg_test --endless --golden

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build for the web
        run: |
          emcmake cmake -S . -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web --target embervale -j4

      - name: Assemble site
        run: |
          mkdir -p site
          cp web/* site/
          cp build-web/embervale.js build-web/embervale.wasm site/
          ls -la site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
